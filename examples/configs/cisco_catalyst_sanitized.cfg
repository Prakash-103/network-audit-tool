! Cisco IOS-XE Sanitized Configuration Example
! Platform: Cisco Catalyst 9300 Series
! Version: 17.09.04a
version 17.9
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname DC1-CORE-SW01
!
boot-start-marker
boot-end-marker
!
vrf definition MGMT
 description Out-of-band Management VRF
 address-family ipv4
 exit-address-family
!
aaa new-model
aaa authentication login default group tacacs+ local
aaa authorization exec default group tacacs+ local
!
ip routing
ip domain-name example.org
!
spanning-tree mode rapid-pvst
spanning-tree extend system-id
!
vlan 10
 name SERVERS-MGMT
!
vlan 20
 name DATA-USERS
!
vlan 99
 name NATIVE-QUARANTINE
!
interface Port-channel1
 description LACP Inter-Core Uplink to DC1-CORE-SW02
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20
!
interface GigabitEthernet1/0/1
 description Firewall Transit Link to DC1-EDGE-FW01
 no switchport
 ip address 10.100.1.2 255.255.255.252
 no shutdown
!
interface HundredGigE1/0/49
 description Trunk Member for Po1
 switchport mode trunk
 switchport trunk native vlan 99
 channel-group 1 mode active
!
interface HundredGigE1/0/50
 description Trunk Member for Po1
 switchport mode trunk
 switchport trunk native vlan 99
 channel-group 1 mode active
!
router ospf 1
 router-id 10.100.1.10
 passive-interface default
 no passive-interface GigabitEthernet1/0/1
 network 10.100.1.0 0.0.0.3 area 0.0.0.0
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
line con 0
 exec-timeout 10 0
 stopbits 2
line vty 0 4
 exec-timeout 15 0
 transport input ssh
line vty 5 15
 exec-timeout 15 0
 transport input ssh
!
end
